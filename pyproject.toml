[project]
name = "soft-sensor-autoresearch"
version = "0.2.0"
description = "Bounded soft-sensor research policy with a governed FDE Kernel Provider boundary"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "plotly",
  "scikit-learn",
  "xgboost",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
frequency = ["tsfresh"]

[project.scripts]
soft-sensor-autoresearch = "soft_sensor_autoresearch.cli:main"
soft-sensor-autoresearch-policy = "soft_sensor_autoresearch.policy_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
